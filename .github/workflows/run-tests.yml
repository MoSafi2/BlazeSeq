name: Run Mojo tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        cache: true

    - name: Build docs
      run: pixi run -e docs docs

    - name: Precompile core (CPU runner)
      run: pixi run build

    - name: Run CPU tests
      run: pixi run test

    - name: Cross-compile GPU example and tests
      run: pixi run check-gpu
