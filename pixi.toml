[workspace]
name = "blazeseq"
version = "0.3.0"
description = "Primitives for FASTQ parsing and GPU-accelerated sequencing utilities in Mojo."
authors = []
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]
license = "MIT"
preview = ["pixi-build"]

[package]
name = "blazeseq"
version = "0.3.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }

[package.host-dependencies]
mojo-compiler = ">=1.0.0,<2"

# [package.target.linux-64.host-dependencies]
# rapidgzip-mojo = { url = "https://github.com/MoSafi2/rapidgzip_mojo/releases/download/v0.1.1/rapidgzip-mojo-0.1.1-hb0f4dca_0.conda" }

# [package.target.osx-arm64.host-dependencies]
# rapidgzip-mojo = { url = "https://github.com/MoSafi2/rapidgzip_mojo/releases/download/v0.1.1/rapidgzip-mojo-0.1.1-h60d57d3_0.conda" }


[package.build-dependencies]
mojo-compiler = ">=1.0.0,<2"
rattler-build = "*"

# [package.target.linux-64.build-dependencies]
# rapidgzip-mojo = { git = "https://github.com/MoSafi2/rapidgzip_mojo.git" }

# [package.target.osx-arm64.build-dependencies]
# rapidgzip-mojo = { git = "https://github.com/MoSafi2/rapidgzip_mojo.git" }

[dependencies]
mojo = ">=1.0.0,<2"

# [target.linux-64.dependencies]
# rapidgzip-mojo = { git = "https://github.com/MoSafi2/rapidgzip_mojo.git" }

# [target.osx-arm64.dependencies]
# rapidgzip-mojo = { git = "https://github.com/MoSafi2/rapidgzip_mojo.git" }


[tasks]
build = "mojo precompile --Werror -I . blazeseq -o blazeseq.mojoc"
test = { cmd = "bash -c 'set -euo pipefail; for file in $(find tests -path tests/gpu -prune -o -name \"test_*.mojo\" -print | sort); do mojo run --Werror -I . -D ASSERT=all \"$file\"; done'" }
[pypi-dependencies]
pymodo = ">=0.11.13, <0.12"

[feature.docs.dependencies]
nodejs = ">=26.6.0,<26.7"

[feature.docs.tasks]
docs = "rm -rf docs/site/src/content/docs/api && modo build && cd docs/site && npm install && node scripts/add-frontmatter.mjs && npm run build"
docs-serve = "modo build && cd docs/site && npm install && node scripts/add-frontmatter.mjs && npm run dev"

[feature.benchmark.dependencies]
hyperfine = ">=1.20.0,<2"
rust = ">=1.97.1,<1.98"
python = ">=3.14.7,<3.15"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.2,<3"
ipykernel = ">=7.1.0,<8"
pandas = ">=3.0.5,<4"
seaborn = ">=0.13.2,<0.14"


[feature.benchmark.tasks]
benchmark-plain = "bash -c 'python benchmark/fastq-parser/bench.py run --workload parser --format plain --fs ramfs --plot --write-artifacts'"
benchmark-mmap = "bash -c 'python benchmark/fastq-parser/bench.py run --workload parser --format plain --parser-backend mmap --fs ramfs --plot --write-artifacts'"
benchmark-fastq-batch-vs-paraseq = "bash -c 'python benchmark/fastq-parser/bench.py run --workload batch_vs_paraseq --format plain --fs ramfs --plot --write-artifacts'"
benchmark-gzip = "bash -c 'python benchmark/fastq-parser/bench.py run --workload parser --format gz --fs ramfs --gzip-threads ${1:-4} --plot --write-artifacts'"
benchmark-gzip-single = "bash -c 'python benchmark/fastq-parser/bench.py run --workload parser --format gz --fs ramfs --gzip-threads 1 --plot --write-artifacts'"
benchmark-throughput = "bash -c './benchmark/throughput/run_throughput_benchmarks.sh'"
benchmark-throughput-validation = "bash -c './benchmark/throughput/run_throughput_validation_benchmarks.sh'"
benchmark-throughput-memory = "bash benchmark/throughput/run_throughput_memory_benchmarks.sh"
benchmark-fasta = "bash -c './benchmark/fasta-parser/run_benchmarks.sh'"
benchmark-plot = "bash -c 'python benchmark/scripts/plot_benchmark_results.py --repo-root . --assets-dir benchmark/results/assets'"

[feature.dev.dependencies]
python = ">=3.14.7,<3.15"
uv = ">=0.12.5,<0.13"
pytest = ">=9.1.1,<10"
act = ">=0.2.89,<0.3"
rattler-build = ">=0.74,<0.75"


[feature.dev.tasks]
test-python-wheel-build = { cmd = "bash -c 'set -euo pipefail; mojo build --Werror -I . --emit shared-lib -o python/blazeseq/_extension/blazeseq_parser.so python/blazeseq_parser.mojo; mojo precompile --Werror -I . blazeseq -o python/blazeseq/mojoc/blazeseq.mojoc; rm -rf python/build python/blazeseq.egg-info; cd python; uv build --wheel --config-setting plat-name=${1:-manylinux2014_x86_64}'" }
test-python-wheel-install = { cmd = "bash -c 'set -euo pipefail; wheel=$(python -c \"from pathlib import Path; ws=sorted(Path(\\\"python/dist\\\").glob(\\\"*.whl\\\"), key=lambda p: p.stat().st_mtime); print(ws[-1])\"); uv venv .venv --clear; . .venv/bin/activate; uv pip install pytest \"$wheel\"; pytest -q tests/test_python_bindings.py'" }
test-workflow-local = { cmd = "act --workflows .github/workflows/build-wheels.yml --job build-wheel" }
rbuild = "rattler-build build --recipe recipe.yaml --output-dir .pixi/build --channel https://conda.modular.com/max --channel conda-forge"
rtest = { cmd = "bash -c 'set -euo pipefail; package=$(find .pixi/build/linux-64 -name \"blazeseq-0.3.0-*.conda\" -print | sort | tail -1); rattler-build test --package-file \"$package\" --channel https://conda.modular.com/max --channel conda-forge'", depends-on = [
    "rbuild",
] }

[feature.gpu.dependencies]
max = ">=26.5,<27"

[feature.gpu.tasks]
build-gpu = "mojo precompile --Werror -I . blazeseq_gpu -o blazeseq_gpu.mojoc"
check-gpu = "mojo build --Werror -I . --target-accelerator=nvidia:sm_89 examples/nw_gpu/main.mojo -o /tmp/blazeseq-nw-sm89"
test-gpu = "mojo run --Werror -I . -D ASSERT=all tests/gpu/test_record_batch.mojo"
package-gpu = "rattler-build build --recipe recipe_gpu.yaml --output-dir .pixi/build --channel https://conda.modular.com/max --channel conda-forge"

[environments]
docs = ["default", "docs"]
benchmark = ["default", "benchmark"]
dev = ["default", "dev"]
gpu = ["default", "gpu", "dev"]
