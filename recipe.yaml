context:
  version: "0.4.0"

package:
  name: "blazeseq"
  version: ${{ version }}

source:
  path: .

build:
  number: 0
  # Let pixi-build-mojo handle the script internally 
  # OR if using rattler-build directly, keep it simple:
  script:
    - mkdir -p $PREFIX/lib/mojo
    - mojo precompile --Werror blazeseq -o $PREFIX/lib/mojo/blazeseq.mojoc

requirements:
  build:
    - ${{ compiler('cxx') }} # Needed if any shim logic is triggered
    - mojo ==1.2.0
    - max ==26.7.0
  host:
    - mojo ==1.2.0
    - max ==26.7.0
  run:
    - mojo ==1.2.0
    - max ==26.7.0

tests:
  - script:
      - test -f $PREFIX/lib/mojo/blazeseq.mojoc
      - mojo --version
      - |
        cat > package_smoke.mojo <<'MOJO'
        from blazeseq import FastqBatch, FastqParser, MemoryReader, DeviceFastqBatch, StagedFastqBatch
        from std.testing import assert_equal

        def main() raises:
            var parser = FastqParser(MemoryReader("@a\nAC\n+\nII\n"))
            var batch = parser.next_batch()
            assert_equal(batch.num_records(), 1)
            assert_equal(batch.get_record(0).sequence(), "AC")
        MOJO
        mojo run --Werror -D ASSERT=all package_smoke.mojo
